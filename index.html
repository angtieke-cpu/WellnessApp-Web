<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#dc8299">
	<meta name="description" content="Be among the first to try HerSolace.">
	<title>HerSolace_Beta</title>
	<link rel="icon" type="image/png" href="assets/favicon.png">
	<style>
		:root {
			color-scheme: light;
			--ink: #342526;
			--muted: #8d7778;
			--paper: #fff8f2;
			--panel: rgba(255, 248, 242, 0.88);
			--accent: #a43e78;
		}

		* { box-sizing: border-box; }

		body {
			min-height: 100vh;
			margin: 0;
			padding: 12px;
			display: grid;
			place-items: center;
			background: var(--paper);
			color: var(--ink);
			font-family: "Avenir Next", Avenir, "Segoe UI", sans-serif;
		}

		main {
			width: min(100%, 1100px);
			min-height: min(560px, calc(100vh - 24px));
			padding: clamp(40px, 7vh, 68px) 24px 44px;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			overflow: hidden;
			border-radius: 38px;
			background: linear-gradient(128deg, #ed8d9d 0%, #c26f9b 57%, #853e9b 100%);
			text-align: center;
			animation: arrive 700ms ease-out both;
		}

		.eyebrow {
			margin: 0 0 14px;
			color: rgba(52, 37, 38, 0.74);
			font-size: 14px;
			font-weight: 600;
			letter-spacing: 0.2em;
			text-transform: uppercase;
		}

		h1 {
			max-width: 900px;
			margin: 0;
			font-family: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Georgia, serif;
			font-size: clamp(42px, 7vw, 62px);
			font-weight: 500;
			line-height: 1.08;
		}

		.store-panel {
			width: min(100%, 360px);
			margin-top: 38px;
			padding: 22px 24px 24px;
			border: 1px solid rgba(83, 53, 53, 0.08);
			border-radius: 26px;
			background: var(--panel);
			animation: arrive 700ms 120ms ease-out both;
		}

		.brand-mark {
			width: 116px;
			height: 116px;
			margin: 0 auto 18px;
			display: grid;
			place-items: center;
			border: 1px solid rgba(88, 63, 59, 0.16);
			background: rgba(246, 231, 219, 0.66);
		}

		.brand-mark img {
			width: 74px;
			height: 74px;
			object-fit: contain;
		}

		.store-name {
			margin: 0 0 5px;
			font-size: 18px;
			font-weight: 600;
		}

		.store-note {
			margin: 0 0 17px;
			color: var(--muted);
			font-size: 14px;
		}

		.download-link {
			min-height: 48px;
			padding: 12px 20px;
			display: inline-flex;
			align-items: center;
			justify-content: center;
			border-radius: 999px;
			background: var(--ink);
			color: white;
			font-size: 15px;
			font-weight: 600;
			text-decoration: none;
			transition: background-color 160ms ease, transform 160ms ease;
		}

		.download-link:hover {
			background: var(--accent);
			transform: translateY(-2px);
		}

		.download-link:focus-visible {
			outline: 3px solid white;
			outline-offset: 4px;
		}

		footer {
			margin-top: 34px;
			color: rgba(52, 37, 38, 0.78);
			font-size: 16px;
		}

		footer a {
			color: var(--ink);
			text-decoration-color: #a43e78;
			text-decoration-thickness: 2px;
			text-underline-offset: 4px;
		}

		@keyframes arrive {
			from { opacity: 0; transform: translateY(12px); }
			to { opacity: 1; transform: translateY(0); }
		}

		@media (max-width: 520px) {
			body { padding: 0; }
			main {
				min-height: 100vh;
				padding: 50px 20px 38px;
				border-radius: 0;
			}
			h1 { font-size: clamp(38px, 11vw, 50px); }
			.store-panel { margin-top: 30px; }
			footer { margin-top: 28px; font-size: 14px; }
		}

		@media (prefers-reduced-motion: reduce) {
			*, *::before, *::after {
				animation-duration: 0.01ms !important;
				animation-iteration-count: 1 !important;
				scroll-behavior: auto !important;
				transition-duration: 0.01ms !important;
			}
		}
	</style>
</head>
<body>
	<main>
		<p class="eyebrow">Beta launch</p>
		<h1>Be among the first to try HerSolace</h1>

		<section class="store-panel" aria-label="Download HerSolace">
			<div class="brand-mark">
				<img src="assets/favicon.png" alt="HerSolace logo">
			</div>
			<p class="store-name" id="store-name">HerSolace</p>
			<p class="store-note" id="store-note">Choose your app store</p>
			<a class="download-link" id="download-link" href="https://apps.apple.com/in/app/hersolace/id6767090399">
				Get the app
			</a>
		</section>

		<footer>Reach us at <a href="mailto:support@hersolace.care">support@hersolace.care</a></footer>
	</main>

	<script>
		const appStoreLinks = {
			apple: 'https://apps.apple.com/in/app/hersolace/id6767090399',
			android: 'https://play.google.com/store/apps/details?id=com.wellness.hersolace'
		};
		const userAgent = navigator.userAgent || '';
		const platform = navigator.userAgentData?.platform || navigator.platform || '';
		const isAndroid = /android/i.test(userAgent) || /android/i.test(platform);
		const isIOS = /iphone|ipad|ipod/i.test(userAgent) ||
			(/mac/i.test(platform) && navigator.maxTouchPoints > 1);
		const isSafari = /safari/i.test(userAgent) && !/chrome|chromium|crios|edg|opr|firefox/i.test(userAgent);
		const useAppleStore = isIOS || (!isAndroid && isSafari);
		const store = useAppleStore ? 'apple' : 'android';
		const link = document.getElementById('download-link');

		link.href = appStoreLinks[store];
		link.textContent = useAppleStore ? 'Download on the App Store' : 'Get it on Google Play';
		document.getElementById('store-name').textContent = useAppleStore ? 'App Store' : 'Google Play';
		document.getElementById('store-note').textContent = 'HerSolace_Beta';
		window.location.replace(appStoreLinks[store]);
	</script>
</body>
</html>
