					translateY(0);

		   MOBILE

</head>

<body>

	<main>

		<p class="eyebrow">
			Beta launch
		</p>

		<h1>
			Be among the first to try HerSolace
		</h1>

		<section
			class="store-panel"
			aria-label="Download HerSolace"
		>

			<div class="brand-mark">

				<img
					src="../assets/favicon.png"
					alt="HerSolace logo"
				>

			</div>

			<p
				class="store-name"
				id="store-name"
			>
				HerSolace
			</p>

			<p
				class="store-note"
				id="store-note"
			>
				Choose your app store
			</p>

			<div
				class="store-buttons"
				id="store-buttons"
			>

				<a
					class="download-link"
					id="apple-link"
					href="https://apps.apple.com/in/app/hersolace/id6767090399"
				>
					Download on the App Store
				</a>

				<a
					class="download-link"
					id="android-link"
					href="https://play.google.com/store/apps/details?id=com.wellness.hersolace"
				>
					Get it on Google Play
				</a>

			</div>

		</section>

		<footer>

			Reach us at

			<a
				href="mailto:support@hersolace.care"
			>
				support@hersolace.care
			</a>

		</footer>

	</main>


	<script>

		/* ==========================================
		   HER SOLACE STORE LINKS
		   ========================================== */

		const appStoreLinks = {

			apple:
				'https://apps.apple.com/in/app/hersolace/id6767090399',

			android:
				'https://play.google.com/store/apps/details?id=com.wellness.hersolace'

		};


		/* ==========================================
		   DEVICE DETECTION
		   ========================================== */

		const userAgent =
			navigator.userAgent || '';

		const platform =
			navigator.userAgentData?.platform ||
			navigator.platform ||
			'';


		/*
			Android detection
		*/

		const isAndroid =
			/android/i.test(userAgent) ||
			/android/i.test(platform);


		/*
			iPhone / iPad / iPod detection

			The second condition also handles
			newer iPads that sometimes report
			themselves as Mac devices.
		*/

		const isIOS =
			/iphone|ipad|ipod/i.test(
				userAgent
			) ||
			(
				/mac/i.test(platform) &&
				navigator.maxTouchPoints > 1
			);


		/* ==========================================
		   HTML ELEMENTS
		   ========================================== */

		const storeButtons =
			document.getElementById(
				'store-buttons'
			);

		const appleLink =
			document.getElementById(
				'apple-link'
			);

		const androidLink =
			document.getElementById(
				'android-link'
			);

		const storeName =
			document.getElementById(
				'store-name'
			);

		const storeNote =
			document.getElementById(
				'store-note'
			);


		/* ==========================================
		   SESSION REDIRECT CONTROL
		   ==========================================

		   This prevents the App Store / Play Store
		   from opening repeatedly when the user
		   returns to Safari/Chrome.

		   The value exists only for the current
		   browser tab/session.
		   ========================================== */

		const REDIRECT_KEY =
			'hersolace_download_store_redirected';


		let alreadyRedirected = false;


		try {

			alreadyRedirected =
				sessionStorage.getItem(
					REDIRECT_KEY
				) === 'true';

		}
		catch (error) {

			console.log(
				'Session storage unavailable'
			);

		}


		/* ==========================================
		   IOS
		   ========================================== */

		if (isIOS) {

			/*
				Only the App Store button is relevant
				on an iPhone/iPad.
			*/

			androidLink.style.display =
				'none';

			storeButtons.classList.add(
				'single'
			);

			storeName.textContent =
				'HerSolace';


			/*
				FIRST VISIT

				Automatically open App Store.
			*/

			if (!alreadyRedirected) {

				storeNote.textContent =
					'Opening HerSolace in the App Store…';

				appleLink.textContent =
					'Open App Store';


				/*
					Save the state BEFORE opening
					the App Store.
				*/

				try {

					sessionStorage.setItem(
						REDIRECT_KEY,
						'true'
					);

				}
				catch (error) {

					console.log(
						'Unable to save redirect state'
					);

				}


				/*
					Give Safari a very small amount
					of time to save sessionStorage
					before handing control to the
					native App Store.
				*/

				setTimeout(
					function () {

						window.location.replace(
							appStoreLinks.apple
						);

					},
					150
				);

			}


			/*
				RETURNING FROM APP STORE

				Do not redirect again.

				Show a button instead.
			*/

			else {

				storeNote.textContent =
					'HerSolace is available on the App Store';

				appleLink.textContent =
					'Continue to App Store';

				appleLink.href =
					appStoreLinks.apple;

			}

		}


		/* ==========================================
		   ANDROID
		   ========================================== */

		else if (isAndroid) {

			/*
				Only Google Play is relevant
				on Android.
			*/

			appleLink.style.display =
				'none';

			storeButtons.classList.add(
				'single'
			);

			storeName.textContent =
				'HerSolace';


			/*
				FIRST VISIT

				Automatically open Google Play.
			*/

			if (!alreadyRedirected) {

				storeNote.textContent =
					'Opening HerSolace in Google Play…';

				androidLink.textContent =
					'Open Google Play';


				try {

					sessionStorage.setItem(
						REDIRECT_KEY,
						'true'
					);

				}
				catch (error) {

					console.log(
						'Unable to save redirect state'
					);

				}


				setTimeout(
					function () {

						window.location.replace(
							appStoreLinks.android
						);

					},
					150
				);

			}


			/*
				RETURNING FROM GOOGLE PLAY

				Do not automatically redirect again.
			*/

			else {

				storeNote.textContent =
					'HerSolace is available on Google Play';

				androidLink.textContent =
					'Continue to Google Play';

				androidLink.href =
					appStoreLinks.android;

			}

		}


		/* ==========================================
		   DESKTOP / OTHER DEVICES
		   ========================================== */

		else {

			/*
				Windows, macOS, Linux or any device
				that isn't positively detected as
				iOS or Android.

				NO automatic redirect.

				Show both store choices 50 / 50.
			*/

			storeName.textContent =
				'HerSolace';

			storeNote.textContent =
				'Choose your app store';


			appleLink.style.display =
				'inline-flex';

			androidLink.style.display =
				'inline-flex';


			appleLink.textContent =
				'Download on the App Store';

			androidLink.textContent =
				'Get it on Google Play';


			appleLink.href =
				appStoreLinks.apple;

			androidLink.href =
				appStoreLinks.android;

		}

	</script>

</body>
</html>
